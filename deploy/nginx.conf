# 放到服务器：/etc/nginx/sites-available/blog
# 然后：ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/
# 把 yourdomain.com 换成你的域名，root 换成实际站点目录

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/blog;
    index index.html;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 隐藏源码地图等（如有）
    location ~ /\. {
        deny all;
    }
}
